<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SazónPOS — Sistema de Gestión para Restaurantes</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      overflow: hidden;
      line-height: 1.5;
    }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', monospace; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 100px; }
    ::-webkit-scrollbar-thumb:hover { background: #CBD5E1; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes scan {
      0% { top: -20%; }
      100% { top: 120%; }
    }
    @keyframes receiptPrint {
      from { max-height: 0; opacity: 0; }
      to { max-height: 800px; opacity: 1; }
    }
    @keyframes bounceIn {
      0% { transform: scale(0.95); opacity: 0; }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes countUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastSlide {
      from { transform: translateX(calc(100% + 20px)); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes barGrow {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }

    .animate-fade-up { animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-fade-in { animation: fadeIn 0.4s ease forwards; }
    .animate-slide-right { animation: slideInRight 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-pulse-slow { animation: pulse 3s ease-in-out infinite; }
    .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-slide-up { animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-count { animation: countUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-toast { animation: toastSlide 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-receipt { animation: receiptPrint 1s cubic-bezier(0.22, 1, 0.36, 1) forwards; overflow: hidden; }

    /* Glass */
    .glass { backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); }

    /* Input resets */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    input, select { outline: none; }

    /* Focus ring */
    .focus-ring:focus { box-shadow: 0 0 0 3px rgba(255, 79, 0, 0.12); }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Subtle pattern for sidebar */
    .sidebar-pattern {
      background-image: radial-gradient(circle at 25% 25%, rgba(255,255,255,0.02) 0%, transparent 50%),
                        radial-gradient(circle at 75% 75%, rgba(255,79,0,0.03) 0%, transparent 50%);
    }
  </style>
</head>

    };

    // ─── DATA ─────────────────────────────────────────────────────────
    const MENU = [
      { id: 1, cat: "Entradas", name: "Causa Limeña", desc: "Papa amarilla, ají amarillo, pollo, palta", price: 18, emoji: "🥔", rating: 4.8, popular: true },

      { id: 4, cat: "Entradas", name: "Tiradito", desc: "Pescado crudo en salsa de ají amarillo", price: 22, emoji: "🐟", rating: 4.7 },
      { id: 5, cat: "Entradas", name: "Solterito", desc: "Ensalada de frijoles, queso, choclo, tomate", price: 14, emoji: "🥗", rating: 4.5 },

    const CATEGORIES = [

    ];
    const TABLES = Array.from({ length: 12 }, (_, i) => ({
      id: i + 1,
      name: `Mesa ${i + 1}`,
      status: i < 3 ? "ocupada" : i < 5 ? "reservada" : "libre",

      order: i < 3 ? Math.floor(Math.random() * 3) + 1 : 0,
    }));
    const money = (n) => `S/ ${n.toFixed(2)}`;

    // ─── QR PATTERN ───────────────────────────────────────────────────
    function QRPattern({ size = 160 }) {
      const [cells] = useState(() => {
        let seed = 137;
        const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
        return Array.from({ length: 121 }, () => rand() > 0.52);
      });
      return (
        <div className="relative bg-white p-3 rounded-2xl shadow-lg border border-slate-100" style={{ width: size, height: size }}>
          <div className="grid grid-cols-11 gap-[2px] w-full h-full">
            {cells.map((on, i) => (
              <div key={i} className={`rounded-[2px] transition-all duration-500 ${on ? "bg-slate-800" : "bg-transparent"}`} />
            ))}
          </div>
          <div className="absolute inset-x-3 h-[2px] bg-gradient-to-r from-transparent via-[#FF4F00]/40 to-transparent" style={{ animation: "scan 3s ease-in-out infinite" }} />
        </div>
      );
    }

    // ─── TOAST ────────────────────────────────────────────────────────
    function Toast({ message, type = "success", onClose }) {
      useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
      const config = {
        success: { bg: "bg-emerald-600", icon: <Icons.check size={16} /> },
        error: { bg: "bg-red-500", icon: <Icons.x size={16} /> },
        info: { bg: "bg-blue-600", icon: <Icons.bell size={16} /> },
      };
      const c = config[type] || config.success;
      return (
        <div className={`animate-toast flex items-center gap-3 ${c.bg} text-white pl-4 pr-5 py-3 rounded-2xl shadow-2xl shadow-black/20`}>
          <span className="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center flex-shrink-0">{c.icon}</span>
          <span className="text-sm font-medium whitespace-nowrap">{message}</span>
        </div>
      );
    }

    // ─── RECEIPT MODAL ────────────────────────────────────────────────
    function ReceiptModal({ ticket, onClose }) {
      if (!ticket) return null;
      return (
        <div className="fixed inset-0 bg-black/40 glass flex items-center justify-center z-50 animate-fade-in p-4" onClick={onClose}>
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-bounce-in" onClick={e => e.stopPropagation()}>

                <div className="absolute bottom-2 right-4 text-6xl">🍜</div>
              </div>
              <div className="relative z-10">

                </div>
                <h2 className="text-xl font-bold tracking-tight">SazónPOS</h2>
                <p className="text-white/70 text-sm mt-1 font-medium">Restaurante Peruano</p>
              </div>
            </div>

            <div className="p-6">
              <div className="animate-receipt">
                {/* Ticket Info */}
                <div className="bg-slate-50 rounded-xl p-4 mb-5">
                  <div className="grid grid-cols-2 gap-3 text-sm">
                    <div><span className="text-slate-400 text-xs block mb-0.5">Fecha</span><span className="mono text-slate-700 font-medium">{new Date().toLocaleDateString("es-PE")}</span></div>
                    <div><span className="text-slate-400 text-xs block mb-0.5">Hora</span><span className="mono text-slate-700 font-medium">{ticket.time}</span></div>
                    <div><span className="text-slate-400 text-xs block mb-0.5">Tipo</span><span className="text-slate-700 font-medium">{ticket.type}</span></div>
                    <div><span className="text-slate-400 text-xs block mb-0.5">Método</span><span className="text-slate-700 font-medium">{ticket.method}</span></div>
                  </div>
                </div>

                {/* Items */}
                <div className="space-y-3 mb-5">
                  {ticket.items.map((item, i) => (
                    <div key={i} className="flex items-center justify-between py-2 border-b border-dashed border-slate-100 last:border-0">
                      <div className="flex items-center gap-2">
                        <span className="w-6 h-6 rounded-lg bg-slate-100 flex items-center justify-center text-xs mono font-bold text-slate-500">{item.qty}x</span>
                        <span className="text-sm text-slate-700 font-medium">{item.name}</span>
                      </div>
                      <span className="mono text-sm font-semibold text-slate-800">{money(item.price * item.qty)}</span>
                    </div>
                  ))}
                </div>

                {/* Totals */}
                <div className="bg-slate-50 rounded-xl p-4 space-y-2.5">
                  <div className="flex justify-between text-sm"><span className="text-slate-500">Op. Gravada</span><span className="mono text-slate-600 font-medium">{money(ticket.total / 1.18)}</span></div>
                  <div className="flex justify-between text-sm"><span className="text-slate-500">IGV (18%)</span><span className="mono text-slate-600 font-medium">{money(ticket.total - ticket.total / 1.18)}</span></div>

            {/* Top Items */}

                  {ventas.slice(0, 8).map((v) => (
                    <tr key={v.id} className="hover:bg-slate-50/50 transition-colors">
                      <td className="px-6 py-4 text-sm mono text-slate-500 font-medium">{v.time}</td>

    // ─── POS ──────────────────────────────────────────────────────────
    function POSPage({ onSale }) {
      const [order, setOrder] = useState([]);
      const [category, setCategory] = useState("Todos");
      const [search, setSearch] = useState("");
      const [method, setMethod] = useState("Efectivo");
      const [cashInput, setCashInput] = useState("");
      const [qrConfirmed, setQrConfirmed] = useState(false);
      const [orderType, setOrderType] = useState("Salón");
      const [selectedTable, setSelectedTable] = useState(null);
      const [showReceipt, setShowReceipt] = useState(null);

      const filtered = useMemo(() => {
        let result = MENU;
        if (category !== "Todos") result = result.filter(m => m.cat === category);
        if (search) result = result.filter(m => m.name.toLowerCase().includes(search.toLowerCase()) || m.desc.toLowerCase().includes(search.toLowerCase()));
        return result;
      }, [category, search]);

      const addItem = useCallback((item) => {
        setOrder(prev => {
          const found = prev.find(p => p.id === item.id);
          if (found) return prev.map(p => p.id === item.id ? { ...p, qty: p.qty + 1 } : p);
          return [...prev, { ...item, qty: 1 }];
        });
      }, []);

      const decItem = useCallback((id) => {
        setOrder(prev => prev.map(p => p.id === id ? { ...p, qty: p.qty - 1 } : p).filter(p => p.qty > 0));
      }, []);

      const removeItem = useCallback((id) => setOrder(prev => prev.filter(p => p.id !== id)), []);
      const clearOrder = useCallback(() => { setOrder([]); setCashInput(""); setQrConfirmed(false); }, []);

      const subtotal = useMemo(() => order.reduce((s, p) => s + p.price * p.qty, 0), [order]);
      const igv = subtotal * 0.18;
      const total = subtotal + igv;
      const received = parseFloat(cashInput || "0");
      const vuelto = received - total;
      const readyToCharge = order.length > 0 && ((method === "Efectivo" && received >= total && total > 0) || (method !== "Efectivo" && qrConfirmed));
      const totalItems = order.reduce((s, p) => s + p.qty, 0);

      const cobrar = () => {
        if (!readyToCharge) return;
        const ticket = {
          id: Date.now(), items: [...order], total, method, type: orderType, table: selectedTable,
          time: new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" }),
        };
        onSale(ticket);
        setShowReceipt(ticket);
        clearOrder();
      };

      return (
        <div className="flex-1 flex overflow-hidden">

            {/* Order Types + Search Row */}
            <div className="flex items-center gap-4 mb-6">
              <div className="flex gap-2 bg-slate-100 rounded-2xl p-1">
                {["Salón", "Para Llevar", "Delivery"].map(type => (
                  <button key={type} onClick={() => { setOrderType(type); if (type !== "Salón") setSelectedTable(null); }}
                    className={`px-5 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 flex items-center gap-2 ${orderType === type ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}>
                    {type === "Salón" ? <Icons.store size={16} /> : type === "Para Llevar" ? <Icons.package size={16} /> : <Icons.truck size={16} />}
                    {type}
                  </button>
                ))}
              </div>
              {orderType === "Salón" && (
                <select value={selectedTable || ""} onChange={e => setSelectedTable(e.target.value || null)}
                  className="px-4 py-2.5 rounded-xl text-sm font-medium bg-white border border-slate-200 text-slate-600 focus:border-[#FF4F00] focus:ring-2 focus:ring-[#FF4F00]/10 transition-all">
                  <option value="">Seleccionar mesa...</option>
                  {TABLES.filter(t => t.status === "libre").map(t => (
                    <option key={t.id} value={t.id}>Mesa {t.id} ({t.capacity} pers.)</option>
                  ))}
                </select>
              )}
              <div className="flex-1"></div>
              <div className="relative w-72">
                <Icons.search size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                <input type="text" placeholder="Buscar plato..." value={search} onChange={e => setSearch(e.target.value)}
                  className="w-full bg-white border border-slate-200 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:border-[#FF4F00] focus:ring-2 focus:ring-[#FF4F00]/10 transition-all" />
                {search && (
                  <button onClick={() => setSearch("")} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 transition-colors">
                    <Icons.x size={14} />
                  </button>
                )}
              </div>
            </div>

            {/* Categories */}
            <div className="flex gap-2 mb-8">
              {CATEGORIES.map(c => (
                <button key={c.id} onClick={() => setCategory(c.id)}

                  <span>{c.emoji}</span> {c.id}

                </button>

            </div>

                <div className="flex justify-between text-sm"><span className="text-slate-500">IGV (18%)</span><span className="mono font-medium text-slate-700">{money(igv)}</span></div>
                <div className="flex justify-between items-center pt-3 border-t border-dashed border-slate-300">
                  <span className="text-slate-900 font-bold">Total</span>
                  <span className="mono text-2xl font-bold text-[#FF4F00]">{money(total)}</span>
                </div>
              </div>

              {/* Payment Method */}
              <p className="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-3">Método de Pago</p>
              <div className="grid grid-cols-3 gap-2 mb-4">
                {[{ id: "Efectivo", icon: Icons.banknote, label: "Efectivo" }, { id: "Plin", icon: Icons.qr, label: "Plin" }, { id: "Yape", icon: Icons.zap, label: "Yape" }].map(m => (
                  <button key={m.id} onClick={() => { setMethod(m.id); setCashInput(""); setQrConfirmed(false); }}
                    className={`py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 border transition-all ${method === m.id ? "bg-slate-900 text-white border-slate-900 shadow-md shadow-slate-900/20" : "bg-white text-slate-600 border-slate-200 hover:border-slate-300"}`}>
                    <m.icon size={14} /> {m.label}
                  </button>
                ))}
              </div>

              {/* Payment Input */}
              <div className="min-h-[80px]">
                {method === "Efectivo" && (
                  <div className="animate-fade-up bg-white p-3.5 rounded-xl border border-slate-200">
                    <div className="relative">
                      <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 mono text-sm font-medium">S/</span>
                      <input type="number" value={cashInput} onChange={e => setCashInput(e.target.value)} placeholder="0.00"
                        className="w-full bg-slate-50 rounded-xl pl-10 pr-3 py-3 mono text-lg font-bold text-slate-900 focus:ring-2 focus:ring-[#FF4F00]/10 focus:border-[#FF4F00] border border-transparent transition-all" />
                    </div>
                    {cashInput !== "" && (
                      <div className={`mt-2.5 p-2.5 rounded-xl text-sm font-semibold flex justify-between items-center ${vuelto >= 0 ? "bg-emerald-50 text-emerald-700" : "bg-red-50 text-red-600"}`}>
                        <span>{vuelto >= 0 ? "Vuelto" : "Faltante"}</span>
                        <span className="mono text-lg font-bold">{money(Math.abs(vuelto))}</span>
                      </div>
                    )}
                  </div>
                )}
                {(method === "Plin" || method === "Yape") && (
                  <div className="animate-fade-up flex flex-col items-center bg-white p-4 rounded-xl border border-slate-200">
                    <QRPattern size={120} />
                    {!qrConfirmed ? (
                      <button onClick={() => setQrConfirmed(true)} className="mt-3 px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold rounded-xl transition-all">
                        Simular pago ({method})
                      </button>
                    ) : (
                      <div className="mt-3 flex items-center gap-2 text-emerald-600 bg-emerald-50 px-5 py-2 rounded-xl text-sm font-semibold animate-bounce-in">
                        <Icons.check size={16} /> Pago confirmado
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* Charge Button */}
              <button onClick={cobrar} disabled={!readyToCharge}
                className={`w-full mt-5 py-4 rounded-2xl text-sm font-bold tracking-wide transition-all duration-300 flex items-center justify-center gap-2 ${readyToCharge ? "bg-gradient-to-r from-[#FF4F00] to-[#E63900] text-white shadow-xl shadow-[#FF4F00]/20 hover:shadow-[#FF4F00]/30 hover:-translate-y-0.5 active:translate-y-0" : "bg-slate-200 text-slate-400 cursor-not-allowed"}`}>
                {readyToCharge ? (
                  <><Icons.check size={18} /> Cobrar {money(total)}</>
                ) : (
                  <span className="text-slate-400">Agrega productos para cobrar</span>
                )}
              </button>
            </div>
          </div>

          {/* Receipt Modal */}
          {showReceipt && <ReceiptModal ticket={showReceipt} onClose={() => setShowReceipt(null)} />}
        </div>
      );
    }

    // ─── DELIVERY ─────────────────────────────────────────────────────
    function DeliveryPage() {
      const [orders] = useState([
        { id: 1, client: "María García", phone: "+51 999 123 456", address: "Av. Javier Prado 1234, Surco", items: "2x Lomo Saltado, 1x Chicha Morada", total: 72, status: "entregado", time: "12:30", rider: "Juan P." },
        { id: 2, client: "Carlos Ruiz", phone: "+51 999 789 012", address: "Jr. de la Unión 456, Cercado", items: "1x Ceviche Mixto, 2x Pisco Sour", total: 75, status: "enviado", time: "13:15", rider: "Luis M." },
        { id: 3, client: "Ana Torres", phone: "+51 999 345 678", address: "Calle Los Olivos 789, San Isidro", items: "3x Ají de Gallina, 1x Inca Kola", total: 84, status: "preparando", time: "13:45", rider: null },
        { id: 4, client: "Pedro Sánchez", phone: "+51 999 901 234", address: "Av. La Marina 321, San Miguel", items: "1x Causa Limeña, 1x Tallarín Saltado", total: 43, status: "pendiente", time: "14:00", rider: null },
      ]);
      const statusConfig = {
        pendiente: { bg: "bg-amber-50", text: "text-amber-700", border: "border-amber-200", dot: "bg-amber-400", icon: "🕐" },
        preparando: { bg: "bg-blue-50", text: "text-blue-700", border: "border-blue-200", dot: "bg-blue-400", icon: "👨‍🍳" },
        enviado: { bg: "bg-violet-50", text: "text-violet-700", border: "border-violet-200", dot: "bg-violet-400", icon: "🛵" },
        entregado: { bg: "bg-emerald-50", text: "text-emerald-700", border: "border-emerald-200", dot: "bg-emerald-400", icon: "✅" },
      };
      return (
        <div className="p-8 space-y-8 animate-fade-in">
          <div>
            <h1 className="text-2xl font-bold text-slate-900 tracking-tight">Delivery</h1>
            <p className="text-slate-500 text-sm mt-1">{orders.filter(o => o.status !== "entregado").length} pedidos activos</p>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            {orders.map((order, i) => {
              const sc = statusConfig[order.status];
              return (
                <div key={order.id} className="animate-fade-up bg-white rounded-2xl border border-slate-100 hover:shadow-xl hover:shadow-slate-200/60 transition-all duration-300 overflow-hidden" style={{ animationDelay: `${i * 0.08}s` }}>
                  <div className={`px-6 py-3 ${sc.bg} flex items-center justify-between`}>
                    <div className="flex items-center gap-2">
                      <span>{sc.icon}</span>
                      <span className={`text-xs font-bold capitalize ${sc.text}`}>{order.status}</span>
                    </div>
                    <span className="text-[11px] text-slate-500 mono font-medium">{order.time}</span>
                  </div>
                  <div className="p-6">
                    <div className="flex items-start justify-between mb-3">
                      <div>
                        <h3 className="font-bold text-slate-900">{order.client}</h3>
                        <p className="text-xs text-slate-400 mt-0.5 mono">{order.phone}</p>
                      </div>
                    </div>
                    <div className="bg-slate-50 rounded-xl p-3 mb-4">
                      <p className="text-xs text-slate-400 mb-1 font-medium">Dirección</p>
                      <p className="text-sm text-slate-700 font-medium">{order.address}</p>
                    </div>
                    <p className="text-sm text-slate-600 mb-4">{order.items}</p>
                    <div className="flex items-center justify-between pt-4 border-t border-slate-100">
                      {order.rider ? (
                        <span className="text-xs text-slate-500 flex items-center gap-1.5"><span className="w-5 h-5 bg-slate-200 rounded-full flex items-center justify-center text-[10px]">🛵</span> {order.rider}</span>
                      ) : (
                        <span className="text-xs text-slate-400">Sin repartidor</span>
                      )}
                      <span className="mono font-bold text-[#FF4F00] text-lg">{money(order.total)}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─── HISTORY ──────────────────────────────────────────────────────
    function HistoryPage({ ventas }) {
      const [filter, setFilter] = useState("all");
      const filtered = useMemo(() => {
        if (filter === "all") return ventas;
        return ventas.filter(v => v.method === filter);
      }, [ventas, filter]);

      return (
        <div className="p-8 space-y-8 animate-fade-in">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-2xl font-bold text-slate-900 tracking-tight">Historial de Ventas</h1>
              <p className="text-slate-500 text-sm mt-1">{ventas.length} transacciones</p>
            </div>
            <div className="flex gap-2 bg-slate-100 rounded-2xl p-1">
              {[{ id: "all", label: "Todas" }, { id: "Efectivo", label: "Efectivo" }, { id: "Plin", label: "Plin" }, { id: "Yape", label: "Yape" }].map(f => (
                <button key={f.id} onClick={() => setFilter(f.id)}
                  className={`px-4 py-2 rounded-xl text-xs font-semibold transition-all ${filter === f.id ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}>
                  {f.label}
                </button>
              ))}
            </div>
          </div>
          {filtered.length === 0 ? (
            <div className="bg-white rounded-2xl p-16 text-center border border-slate-100">
              <div className="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <Icons.receipt size={28} className="text-slate-300" />
              </div>
              <p className="font-semibold text-slate-600">Sin ventas registradas</p>
              <p className="text-sm text-slate-400 mt-1">Las transacciones aparecerán aquí</p>
            </div>
          ) : (
            <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
              <table className="w-full">
                <thead>
                  <tr className="bg-slate-50/80 text-left text-[11px] text-slate-400 uppercase tracking-wider">
                    <th className="px-6 py-3 font-semibold">ID</th>
                    <th className="px-6 py-3 font-semibold">Hora</th>
                    <th className="px-6 py-3 font-semibold">Tipo</th>
                    <th className="px-6 py-3 font-semibold">Items</th>
                    <th className="px-6 py-3 font-semibold">Método</th>
                    <th className="px-6 py-3 font-semibold text-right">Total</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-50">
                  {filtered.map(v => (
                    <tr key={v.id} className="hover:bg-slate-50/50 transition-colors">
                      <td className="px-6 py-4 text-sm mono text-slate-400 font-medium">#{String(v.id).slice(-6)}</td>
                      <td className="px-6 py-4 text-sm mono text-slate-600 font-medium">{v.time}</td>
                      <td className="px-6 py-4"><span className="text-[11px] font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg">{v.type}</span></td>
                      <td className="px-6 py-4 text-sm text-slate-600">{v.items.reduce((s, i) => s + i.qty, 0)} items</td>
                      <td className="px-6 py-4"><span className={`text-[11px] font-semibold px-2.5 py-1 rounded-lg ${v.method === "Efectivo" ? "bg-emerald-50 text-emerald-600" : v.method === "Plin" ? "bg-blue-50 text-blue-600" : "bg-violet-50 text-violet-600"}`}>{v.method}</span></td>
                      <td className="px-6 py-4 text-sm font-bold text-slate-900 text-right mono">{money(v.total)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ─── SETTINGS ─────────────────────────────────────────────────────
    function SettingsPage() {
      return (
        <div className="p-8 space-y-8 animate-fade-in max-w-3xl">
          <div>
            <h1 className="text-2xl font-bold text-slate-900 tracking-tight">Configuración</h1>
            <p className="text-slate-500 text-sm mt-1">Personaliza tu sistema POS</p>
          </div>

          {/* Restaurant Info */}
          <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
            <div className="px-6 py-5 border-b border-slate-100">
              <h3 className="font-bold text-slate-900">Información del Restaurante</h3>
            </div>
            <div className="p-6">
              <div className="grid grid-cols-2 gap-5">
                <div>
                  <label className="text-xs font-semibold text-slate-500 mb-2 block uppercase tracking-wider">Nombre</label>
                  <input defaultValue="Sazón Peru" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 focus:border-[#FF4F00] focus:ring-2 focus:ring-[#FF4F00]/10 transition-all" />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-500 mb-2 block uppercase tracking-wider">RUC</label>
                  <input defaultValue="20512345678" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 mono focus:border-[#FF4F00] focus:ring-2 focus:ring-[#FF4F00]/10 transition-all" />
                </div>
                <div className="col-span-2">
                  <label className="text-xs font-semibold text-slate-500 mb-2 block uppercase tracking-wider">Dirección</label>
                  <input defaultValue="Av. Javier Prado Este 4200, Santiago de Surco, Lima" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 focus:border-[#FF4F00] focus:ring-2 focus:ring-[#FF4F00]/10 transition-all" />
                </div>
              </div>
            </div>
          </div>

          {/* Printer */}
          <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
            <div className="px-6 py-5 border-b border-slate-100">
              <h3 className="font-bold text-slate-900">Impresora</h3>
            </div>
            <div className="p-6">
              <div className="grid grid-cols-2 gap-5">
                <div>
                  <label className="text-xs font-semibold text-slate-500 mb-2 block uppercase tracking-wider">Tipo</label>
                  <select className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 focus:border-[#FF4F00] focus:ring-2 focus:ring-[#FF4F00]/10 transition-all">
                    <option>Thermal 80mm</option>
                    <option>Thermal 58mm</option>
                    <option>Matrix</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-500 mb-2 block uppercase tracking-wider">Puerto</label>
                  <input defaultValue="COM3" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 mono focus:border-[#FF4F00] focus:ring-2 focus:ring-[#FF4F00]/10 transition-all" />
                </div>
              </div>
            </div>
          </div>

          {/* IGV */}
          <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
            <div className="px-6 py-5 border-b border-slate-100">
              <h3 className="font-bold text-slate-900">Impuestos</h3>
            </div>
            <div className="p-6">
              <label className="flex items-center gap-3 cursor-pointer group">
                <div className="relative">
                  <input type="checkbox" defaultChecked className="sr-only peer" />
                  <div className="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:bg-[#FF4F00] transition-colors"></div>
                  <div className="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow-sm transition-transform peer-checked:translate-x-5"></div>
                </div>
                <div>
                  <span className="text-sm font-semibold text-slate-700 group-hover:text-slate-900 transition-colors">Incluir IGV (18%) automáticamente</span>
                  <p className="text-xs text-slate-400 mt-0.5">Se calculará sobre cada venta</p>
                </div>
              </label>
            </div>
          </div>

          <div className="flex justify-end">
            <button className="px-8 py-3 bg-gradient-to-r from-[#FF4F00] to-[#E63900] text-white rounded-2xl font-semibold text-sm hover:shadow-lg hover:shadow-[#FF4F00]/20 transition-all active:scale-[0.98]">Guardar Cambios</button>
          </div>
        </div>
      );
    }

    // ─── MAIN APP ─────────────────────────────────────────────────────
    export default function App() {
      const [page, setPage] = useState("pos");
      const [ventas, setVentas] = useState([]);
      const [toast, setToast] = useState(null);
      const [isLoaded, setIsLoaded] = useState(false);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

      useEffect(() => { setIsLoaded(true); }, []);

      const showToast = useCallback((message, type = "success") => {
        setToast({ message, type, id: Date.now() });
      }, []);

      const handleSale = useCallback((ticket) => {
        setVentas(prev => [ticket, ...prev]);
        showToast(`Venta registrada · ${money(ticket.total)}`);
      }, [showToast]);

      const totalCaja = ventas.reduce((s, v) => s + v.total, 0);

      const navItems = [
        { id: "dashboard", icon: Icons.home, label: "Dashboard" },
        { id: "pos", icon: Icons.grid, label: "Punto de Venta" },
        { id: "tables", icon: Icons.store, label: "Mesas" },
        { id: "delivery", icon: Icons.truck, label: "Delivery" },
        { id: "history", icon: Icons.receipt, label: "Historial" },
        { id: "settings", icon: Icons.settings2, label: "Configuración" },
      ];

      return (
        <div className={`h-screen flex overflow-hidden transition-opacity duration-700 ${isLoaded ? "opacity-100" : "opacity-0"}`}>
          {/* Sidebar */}
          <aside className={`${sidebarCollapsed ? "w-[72px]" : "w-60"} bg-[#0F172A] text-slate-400 flex flex-col justify-between py-5 transition-all duration-300 z-20 flex-shrink-0 sidebar-pattern`}>
            <div>
              {/* Logo */}
              <div className={`flex items-center ${sidebarCollapsed ? "justify-center" : "justify-start px-5"} mb-10`}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#FF4F00] to-[#E63900] flex items-center justify-center shadow-lg shadow-[#FF4F00]/20 flex-shrink-0">
                  <Icons.utensils size={20} strokeWidth={2} />
                </div>
                {!sidebarCollapsed && (
                  <div className="ml-3">
                    <span className="font-extrabold text-lg text-white tracking-tight">Sazón</span>
                    <span className="font-extrabold text-lg text-[#FF4F00]">POS</span>
                  </div>
                )}
              </div>

              {/* Navigation */}
              <nav className="space-y-1 px-3">
                {navItems.map(item => (
                  <button key={item.id} onClick={() => setPage(item.id)}
                    className={`w-full flex items-center ${sidebarCollapsed ? "justify-center" : "justify-start"} px-3 py-2.5 rounded-xl transition-all duration-200 text-sm ${page === item.id ? "bg-[#FF4F00]/10 text-[#FF4F00] font-semibold" : "text-slate-500 hover:bg-white/5 hover:text-slate-200"}`}>
                    <item.icon size={20} strokeWidth={page === item.id ? 2 : 1.75} />
                    {!sidebarCollapsed && <span className="ml-3">{item.label}</span>}
                  </button>
                ))}
              </nav>
            </div>

            <div className="px-3 space-y-3">
              {/* Collapse button */}
              <button onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                className="w-full flex items-center justify-center px-3 py-2.5 rounded-xl text-slate-600 hover:bg-white/5 hover:text-slate-300 transition-all">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ transform: sidebarCollapsed ? "rotate(180deg)" : "none", transition: "transform 0.3s" }}>
                  <polyline points="15 18 9 12 15 6" />
                </svg>
              </button>

              {/* User */}
              <div className="bg-white/5 rounded-xl p-3 flex items-center cursor-pointer hover:bg-white/8 transition-all">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-[#FF4F00] to-[#E63900] flex items-center justify-center text-white text-xs font-bold flex-shrink-0 shadow-sm shadow-[#FF4F00]/20">AD</div>
                {!sidebarCollapsed && (
                  <div className="ml-3 min-w-0">
                    <p className="text-sm text-white font-semibold truncate">Admin Demo</p>
                    <p className="text-[11px] text-slate-500 truncate">Caja Principal</p>
                  </div>
                )}
              </div>
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 flex flex-col h-full bg-[#F8FAFC] overflow-hidden">
            {/* Topbar */}
            <header className="h-16 bg-white/80 glass border-b border-slate-200/60 px-8 flex items-center justify-between z-10 flex-shrink-0">
              <div>
                <h2 className="font-bold text-slate-900 text-lg tracking-tight">
                  {navItems.find(n => n.id === page)?.label}
                </h2>
              </div>
              <div className="flex items-center gap-6">
                <div className="text-right hidden sm:block">
                  <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Caja Actual</p>
                  <p className="mono text-lg font-bold text-emerald-600">{money(totalCaja)}</p>
                </div>
                <div className="w-px h-8 bg-slate-200/60 hidden sm:block"></div>
                <button className="relative p-2.5 text-slate-400 hover:text-slate-600 transition-colors bg-slate-100 rounded-xl hover:bg-slate-200/80">
                  <Icons.bell size={18} />
                  {ventas.length > 0 && (
                    <span className="absolute -top-0.5 -right-0.5 w-4 h-4 bg-[#FF4F00] text-white text-[9px] font-bold rounded-full flex items-center justify-center shadow-sm shadow-[#FF4F00]/30">{Math.min(ventas.length, 9)}</span>
                  )}
                </button>
              </div>
            </header>

            {/* Page Content */}
            <div className="flex-1 overflow-hidden flex">
              {page === "dashboard" && <div className="flex-1 overflow-y-auto"><Dashboard ventas={ventas} /></div>}
              {page === "pos" && <POSPage onSale={handleSale} />}
              {page === "tables" && <div className="flex-1 overflow-y-auto"><TablesPage /></div>}
              {page === "delivery" && <div className="flex-1 overflow-y-auto"><DeliveryPage /></div>}
              {page === "history" && <div className="flex-1 overflow-y-auto"><HistoryPage ventas={ventas} /></div>}
              {page === "settings" && <div className="flex-1 overflow-y-auto"><SettingsPage /></div>}
            </div>
          </main>

          {/* Toast */}
          <div className="fixed top-5 right-5 z-50">
            {toast && <Toast key={toast.id} message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
