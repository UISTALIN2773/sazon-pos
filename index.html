<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SazónPOS — Sistema de Gestión para Restaurantes</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #F1F5F9; color: #1E293B; overflow: hidden; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', monospace; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes scan { 0% { top: -100%; } 100% { top: 200%; } }
    @keyframes receiptPrint { 0% { max-height: 0; opacity: 0; } 100% { max-height: 600px; opacity: 1; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.05); } 70% { transform: scale(0.95); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes confetti { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-200px) rotate(720deg); opacity: 0; } }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes countUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes toastOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
    .animate-fade-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
    .animate-slide-right { animation: slideInRight 0.3s ease-out forwards; }
    .animate-slide-left { animation: slideInLeft 0.3s ease-out forwards; }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-count { animation: countUp 0.5s ease-out forwards; }
    .animate-toast-in { animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-toast-out { animation: toastOut 0.3s ease-in forwards; }
    .animate-receipt { animation: receiptPrint 0.8s ease-out forwards; overflow: hidden; }
    .animate-shimmer { background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%); background-size: 200% 100%; animation: shimmer 2s infinite; }
    .delay-100 { animation-delay: 0.1s; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-300 { animation-delay: 0.3s; }
    .delay-400 { animation-delay: 0.4s; }
    .glass { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .ripple-effect { position: relative; overflow: hidden; }
    .ripple-effect::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,0.3) 10%, transparent 10.01%); transform: scale(10); opacity: 0; }
    .ripple-effect:active::after { transform: scale(0); opacity: 1; transition: 0s; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
  </style>
</head>

      settings: (p) => <Icon {...p} d="M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />,

      download: (p) => <Icon {...p} d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" />,
      store: (p) => <Icon {...p} d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />,
      utensils: (p) => <Icon {...p} d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2M7 2v20M21 15V2c-1.66 0-3 1.34-3 3v5c0 1.66 1.34 3 3 3v7" />,

      package: (p) => <Icon {...p} d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" />,
      trendingUp: (p) => <Icon {...p} d="M23 6l-9.5 9.5-5-5L1 18" />,
      dollarSign: (p) => <Icon {...p} d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" />,
      printer: (p) => <Icon {...p} d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z" />,
      eye: (p) => <Icon {...p} d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 100-6 3 3 0 000 6z" />,
      refresh: (p) => <Icon {...p} d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />,
    };

    // ─── DATA ─────────────────────────────────────────────────────────
    const MENU = [
      { id: 1, cat: "Entradas", name: "Causa Limeña", desc: "Papa amarilla, ají amarillo, pollo, palta", price: 18, emoji: "🥔", rating: 4.8 },
      { id: 2, cat: "Entradas", name: "Papa a la Huancaína", desc: "Papas con salsa de ají amarillo y queso", price: 15, emoji: "🧀", rating: 4.6 },
      { id: 3, cat: "Entradas", name: "Anticuchos de Corazón", desc: "Brochetas de corazón de res a la parrilla", price: 20, emoji: "🍢", rating: 4.9 },
      { id: 4, cat: "Entradas", name: "Tiradito", desc: "Pescado crudo en salsa de ají amarillo", price: 22, emoji: "🐟", rating: 4.7 },
      { id: 5, cat: "Entradas", name: "Solterito", desc: "Ensalada de frijoles, queso, choclo, tomate", price: 14, emoji: "🥗", rating: 4.5 },
      { id: 6, cat: "Fondos", name: "Lomo Saltado", desc: "Lomo de res salteado, papas fritas y arroz", price: 32, emoji: "🥩", rating: 4.9 },
      { id: 7, cat: "Fondos", name: "Ají de Gallina", desc: "Pollo deshilachado en crema de ají amarillo", price: 26, emoji: "🍗", rating: 4.7 },
      { id: 8, cat: "Fondos", name: "Arroz con Pollo", desc: "Arroz verde con pollo y salsa criolla", price: 24, emoji: "🍛", rating: 4.6 },
      { id: 9, cat: "Fondos", name: "Chicharrón de Pescado", desc: "Pescado frito, yuca y salsa criolla", price: 28, emoji: "🐡", rating: 4.8 },
      { id: 10, cat: "Fondos", name: "Tallarín Saltado", desc: "Tallarines salteados estilo chifa con carne", price: 25, emoji: "🍝", rating: 4.5 },
      { id: 11, cat: "Fondos", name: "Rocoto Relleno", desc: "Rocoto relleno de carne, gratinado", price: 22, emoji: "🌶️", rating: 4.4 },
      { id: 12, cat: "Fondos", name: "Ceviche Mixto", desc: "Pescado, calamar, langostinos, leche de tigre", price: 35, emoji: "🦐", rating: 4.9 },
      { id: 13, cat: "Fondos", name: "Seco de Cordero", desc: "Cordero guisado con cilantro y frejoles", price: 30, emoji: "🍖", rating: 4.7 },
      { id: 14, cat: "Bebidas", name: "Chicha Morada", desc: "Maíz morado, frutas y especias", price: 8, emoji: "🥤", rating: 4.6 },
      { id: 15, cat: "Bebidas", name: "Inca Kola", desc: "Gaseosa peruana 500 ml", price: 6, emoji: "🍾", rating: 4.3 },
      { id: 16, cat: "Bebidas", name: "Pisco Sour", desc: "Pisco, limón, jarabe de goma, clara", price: 18, emoji: "🍸", rating: 4.9 },
      { id: 17, cat: "Bebidas", name: "Maracuyá Sour", desc: "Pisco, maracuyá, jarabe, clara", price: 20, emoji: "🍹", rating: 4.8 },
      { id: 18, cat: "Bebidas", name: "Agua Mineral", desc: "San Luis 625 ml", price: 4, emoji: "💧", rating: 4.0 },
      { id: 19, cat: "Postres", name: "Suspiro a la Limeña", desc: "Manjar blanco y merengue al oporto", price: 12, emoji: "🍮", rating: 4.8 },
      { id: 20, cat: "Postres", name: "Picarones", desc: "Buñuelos de zapallo y camote, miel de chancaca", price: 10, emoji: "🍩", rating: 4.7 },
      { id: 21, cat: "Postres", name: "Mazamorra Morada", desc: "Postre de maíz morado con frutas", price: 9, emoji: "🥣", rating: 4.5 },
      { id: 22, cat: "Postres", name: "Tres Leches", desc: "Pastel bañado en tres leches", price: 14, emoji: "🍰", rating: 4.9 },
    ];
    const CATEGORIES = ["Todos", "Entradas", "Fondos", "Bebidas", "Postres"];
    const TABLES = Array.from({ length: 12 }, (_, i) => ({ id: i + 1, name: `Mesa ${i + 1}`, status: i < 3 ? "ocupada" : i < 5 ? "reservada" : "libre", capacity: i % 3 === 0 ? 4 : i % 3 === 1 ? 2 : 6 }));
    const money = (n) => `S/ ${n.toFixed(2)}`;

    // ─── QR PATTERN ───────────────────────────────────────────────────
    function QRPattern({ size = 160 }) {
      const s = 137; let seed = s;
      const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
      const cells = Array.from({ length: 121 }, () => rand() > 0.52);
      return (
        <div className="relative bg-white p-3 rounded-2xl shadow-lg border border-slate-100" style={{ width: size, height: size }}>
          <div className="grid grid-cols-11 gap-[2px] w-full h-full">
            {cells.map((on, i) => (
              <div key={i} className={`rounded-[2px] transition-all duration-500 ${on ? "bg-slate-800" : "bg-transparent"}`} />
            ))}
          </div>
          <div className="absolute inset-x-3 h-0.5 bg-gradient-to-b from-transparent via-[#FF4F00]/30 to-transparent" style={{ animation: "scan 2.5s ease-in-out infinite" }} />
        </div>
      );
    }

    // ─── TOAST SYSTEM ─────────────────────────────────────────────────
    function Toast({ message, type = "success", onClose }) {
      useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
      const colors = { success: "bg-emerald-500", error: "bg-red-500", info: "bg-blue-500", warning: "bg-amber-500" };
      return (
        <div className={`animate-toast-in flex items-center gap-3 ${colors[type]} text-white px-5 py-3 rounded-xl shadow-2xl`}>
          {type === "success" && <Icons.check size={18} />}
          {type === "error" && <Icons.x size={18} />}
          {type === "info" && <Icons.bell size={18} />}
          <span className="text-sm font-medium">{message}</span>
        </div>
      );
    }

    // ─── RECEIPT MODAL ────────────────────────────────────────────────
    function ReceiptModal({ ticket, onClose }) {
      if (!ticket) return null;
      return (
        <div className="fixed inset-0 bg-black/50 glass flex items-center justify-center z-50 animate-fade-in" onClick={onClose}>
          <div className="bg-white rounded-3xl shadow-2xl w-96 max-h-[90vh] overflow-hidden animate-bounce-in" onClick={e => e.stopPropagation()}>
            <div className="bg-gradient-to-r from-[#FF4F00] to-[#E63900] p-6 text-white text-center">
              <div className="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3">
                <Icons.utensils size={28} />
              </div>
              <h2 className="text-xl font-bold">SazónPOS</h2>
              <p className="text-white/80 text-sm mt-1">Restaurante Peruano</p>
            </div>
            <div className="p-6">
              <div className="animate-receipt">
                <div className="border-b border-dashed border-slate-200 pb-4 mb-4">
                  <div className="flex justify-between text-sm text-slate-500 mb-1">
                    <span>Fecha:</span>
                    <span className="mono">{new Date().toLocaleDateString("es-PE")}</span>
                  </div>
                  <div className="flex justify-between text-sm text-slate-500 mb-1">
                    <span>Hora:</span>
                    <span className="mono">{ticket.time}</span>
                  </div>
                  <div className="flex justify-between text-sm text-slate-500">
                    <span>Tipo:</span>
                    <span>{ticket.type}</span>
                  </div>
                </div>
                <div className="space-y-3 mb-4">
                  {ticket.items.map((item, i) => (
                    <div key={i} className="flex justify-between text-sm">
                      <span className="text-slate-700">{item.qty}x {item.name}</span>
                      <span className="mono font-medium">{money(item.price * item.qty)}</span>
                    </div>
                  ))}
                </div>
                <div className="border-t border-dashed border-slate-200 pt-4 space-y-2">
                  <div className="flex justify-between text-sm text-slate-500">
                    <span>Op. Gravada</span>
                    <span className="mono">{money(ticket.total / 1.18)}</span>
                  </div>
                  <div className="flex justify-between text-sm text-slate-500">
                    <span>IGV (18%)</span>
                    <span className="mono">{money(ticket.total - ticket.total / 1.18)}</span>
                  </div>
                  <div className="flex justify-between text-lg font-bold text-slate-800 pt-2 border-t border-slate-300">
                    <span>TOTAL</span>
                    <span className="mono text-[#FF4F00]">{money(ticket.total)}</span>
                  </div>
                </div>
                <div className="text-center mt-6 pt-4 border-t border-dashed border-slate-200">
                  <p className="text-xs text-slate-400">Método: {ticket.method}</p>
                  <p className="text-xs text-slate-400 mt-1">¡Gracias por su preferencia!</p>
                  <p className="text-[10px] text-slate-300 mt-2 mono">Ticket #{String(ticket.id).slice(-6)}</p>
                </div>
              </div>
            </div>
            <div className="p-4 border-t border-slate-100 flex gap-3">
              <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-medium text-sm hover:bg-slate-200 transition-colors">Cerrar</button>
              <button className="flex-1 py-3 rounded-xl bg-[#FF4F00] text-white font-medium text-sm hover:bg-[#E63900] transition-colors flex items-center justify-center gap-2">
                <Icons.printer size={16} /> Imprimir
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── DASHBOARD PAGE ───────────────────────────────────────────────
    function Dashboard({ ventas }) {
      const totalHoy = ventas.reduce((s, v) => s + v.total, 0);
      const totalTransacciones = ventas.length;
      const ticketPromedio = totalTransacciones > 0 ? totalHoy / totalTransacciones : 0;
      const efectivo = ventas.filter(v => v.method === "Efectivo").reduce((s, v) => s + v.total, 0);
      const digital = ventas.filter(v => v.method !== "Efectivo").reduce((s, v) => s + v.total, 0);
      const hourlyData = [12, 8, 15, 22, 35, 42, 38, 28, 18, 10, 5, 3];
      const maxH = Math.max(...hourlyData);
      const topItems = {};

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div className="lg:col-span-2 bg-white rounded-2xl p-6 border border-slate-100 animate-fade-up delay-200">

                ))}
              </div>

            <div className="bg-white rounded-2xl p-6 border border-slate-100 animate-fade-up delay-300">
              <h3 className="font-bold text-slate-800 mb-4">Platos Más Vendidos</h3>

          <div className="bg-white rounded-2xl p-6 border border-slate-100 animate-fade-up delay-400">

                        <td className="py-3 text-sm mono text-slate-600">{v.time}</td>

    // ─── POS PAGE ─────────────────────────────────────────────────────
    function POSPage({ onSale }) {
      const [order, setOrder] = useState([]);
      const [category, setCategory] = useState("Todos");
      const [search, setSearch] = useState("");
      const [method, setMethod] = useState("Efectivo");
      const [cashInput, setCashInput] = useState("");
      const [qrConfirmed, setQrConfirmed] = useState(false);
      const [orderType, setOrderType] = useState("Salón");
      const [selectedTable, setSelectedTable] = useState(null);
      const [showReceipt, setShowReceipt] = useState(null);

      const filtered = useMemo(() => {
        let result = MENU;
        if (category !== "Todos") result = result.filter(m => m.cat === category);
        if (search) result = result.filter(m => m.name.toLowerCase().includes(search.toLowerCase()) || m.desc.toLowerCase().includes(search.toLowerCase()));
        return result;
      }, [category, search]);

      const addItem = useCallback((item) => {
        setOrder(prev => {
          const found = prev.find(p => p.id === item.id);
          if (found) return prev.map(p => p.id === item.id ? { ...p, qty: p.qty + 1 } : p);
          return [...prev, { ...item, qty: 1 }];
        });
      }, []);

      const decItem = useCallback((id) => {
        setOrder(prev => prev.map(p => p.id === id ? { ...p, qty: p.qty - 1 } : p).filter(p => p.qty > 0));
      }, []);

      const removeItem = useCallback((id) => setOrder(prev => prev.filter(p => p.id !== id)), []);

      const clearOrder = useCallback(() => { setOrder([]); setCashInput(""); setQrConfirmed(false); }, []);

      const subtotal = useMemo(() => order.reduce((s, p) => s + p.price * p.qty, 0), [order]);
      const igv = subtotal * 0.18;
      const total = subtotal + igv;
      const received = parseFloat(cashInput || "0");
      const vuelto = received - total;
      const readyToCharge = order.length > 0 && ((method === "Efectivo" && received >= total && total > 0) || (method !== "Efectivo" && qrConfirmed));

      const cobrar = () => {
        if (!readyToCharge) return;
        const ticket = {
          id: Date.now(), items: [...order], total, method, type: orderType,
          table: selectedTable, time: new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" }),
        };
        onSale(ticket);
        setShowReceipt(ticket);
        clearOrder();
      };

      return (
        <div className="flex-1 flex overflow-hidden">
          {/* Menu Area */}
          <div className="flex-1 overflow-y-auto p-6 scroll-smooth">
            {/* Order Types */}
            <div className="flex gap-3 mb-6">
              {["Salón", "Para Llevar", "Delivery"].map(type => (
                <button key={type} onClick={() => { setOrderType(type); if (type !== "Salón") setSelectedTable(null); }}
                  className={`px-5 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 flex items-center gap-2 ${orderType === type ? "bg-slate-900 text-white shadow-lg shadow-slate-900/20" : "bg-white text-slate-600 border border-slate-200 hover:border-slate-300"}`}>
                  {type === "Salón" ? <Icons.store size={16} /> : type === "Para Llevar" ? <Icons.package size={16} /> : <Icons.truck size={16} />}
                  {type}
                </button>
              ))}
              {orderType === "Salón" && (
                <select value={selectedTable || ""} onChange={e => setSelectedTable(e.target.value || null)}
                  className="px-4 py-2.5 rounded-xl text-sm font-medium bg-white border border-slate-200 text-slate-600 focus:outline-none focus:ring-2 focus:ring-[#FF4F00]/20 focus:border-[#FF4F00]">
                  <option value="">Seleccionar mesa...</option>
                  {TABLES.filter(t => t.status === "libre").map(t => (
                    <option key={t.id} value={t.id}>Mesa {t.id} ({t.capacity} pers.)</option>
                  ))}
                </select>
              )}
            </div>

            {/* Search */}
            <div className="relative mb-6">
              <Icons.search size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
              <input type="text" placeholder="Buscar plato, bebida o ingrediente..." value={search} onChange={e => setSearch(e.target.value)}
                className="w-full bg-white border border-slate-200 rounded-2xl pl-12 pr-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#FF4F00]/20 focus:border-[#FF4F00] transition-all shadow-sm" />
              {search && (
                <button onClick={() => setSearch("")} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                  <Icons.x size={16} />
                </button>
              )}
            </div>

            {/* Categories */}
            <div className="flex gap-2 overflow-x-auto pb-4 mb-6 no-scrollbar">
              {CATEGORIES.map(c => (
                <button key={c} onClick={() => setCategory(c)}
                  className={`px-5 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all duration-300 ${category === c ? "bg-[#FF4F00] text-white shadow-lg shadow-[#FF4F00]/30" : "bg-white text-slate-600 border border-slate-200 hover:border-[#FF4F00]/50 hover:text-[#FF4F00]"}`}>
                  {c === "Todos" ? "🍽️ " : ""}{c}
                </button>
              ))}
            </div>

            {/* Products Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-4 pb-8">
              {filtered.map((item, index) => (
                <button key={item.id} onClick={() => addItem(item)}
                  className="animate-fade-up opacity-0 flex flex-col text-left bg-white rounded-2xl p-4 border border-slate-100 hover:border-[#FF4F00] hover:shadow-xl hover:shadow-[#FF4F00]/10 transition-all duration-300 group hover:-translate-y-1 relative overflow-hidden"
                  style={{ animationDelay: `${index * 0.04}s` }}>
                  <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity">
                    <span className="bg-[#FF4F00] text-white w-7 h-7 rounded-full flex items-center justify-center shadow-lg">
                      <Icons.plus size={14} />
                    </span>
                  </div>
                  <div className="text-4xl mb-3 bg-gradient-to-br from-slate-50 to-slate-100 w-16 h-16 flex items-center justify-center rounded-2xl group-hover:scale-110 transition-transform duration-300">{item.emoji}</div>
                  <h3 className="font-semibold text-slate-800 leading-tight">{item.name}</h3>
                  <p className="text-xs text-slate-400 mt-1 leading-snug line-clamp-2 flex-1">{item.desc}</p>
                  <div className="flex items-center justify-between w-full mt-3 pt-3 border-t border-slate-50">
                    <p className="mono text-[#FF4F00] font-bold text-lg">{money(item.price)}</p>
                    <div className="flex items-center gap-1">
                      <Icons.star size={12} className="text-amber-400 fill-amber-400" />
                      <span className="text-xs text-slate-400 mono">{item.rating}</span>
                    </div>
                  </div>
                </button>
              ))}
              {filtered.length === 0 && (
                <div className="col-span-full py-16 text-center text-slate-400">
                  <Icons.search size={48} className="mx-auto mb-4 opacity-30" />
                  <p className="font-medium">No se encontraron resultados</p>
                  <p className="text-sm mt-1">Intenta con otro término de búsqueda</p>
                </div>
              )}
            </div>
          </div>

          {/* ORDER TICKET */}
          <div className="w-[400px] bg-white border-l border-slate-200 flex flex-col shadow-[-10px_0_30px_rgba(0,0,0,0.03)] z-10">
            <div className="p-5 border-b border-slate-100 bg-gradient-to-r from-slate-50 to-white">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <Icons.cart size={20} className="text-[#FF4F00]" />
                    Orden Actual
                  </h2>
                  <p className="text-xs text-slate-500 mt-0.5">{orderType}{selectedTable ? ` • Mesa ${selectedTable}` : ""} • {new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" })}</p>
                </div>
                {order.length > 0 && (
                  <button onClick={clearOrder} className="text-xs font-medium text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-full transition-colors flex items-center gap-1">
                    <Icons.trash size={12} /> Limpiar
                  </button>
                )}
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-5 space-y-3">
              {order.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-slate-300 space-y-3">
                  <Icons.receipt size={56} className="opacity-20" />
                  <p className="text-sm font-medium">La orden está vacía</p>
                  <p className="text-xs text-slate-400">Agrega productos del menú</p>
                </div>
              ) : (
                order.map((p, idx) => (
                  <div key={p.id} className="animate-slide-right flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50 transition-colors group" style={{ animationDelay: `${idx * 0.05}s` }}>
                    <span className="text-2xl">{p.emoji}</span>
                    <div className="flex-1 min-w-0">
                      <p className="font-medium text-slate-800 text-sm truncate">{p.name}</p>
                      <p className="text-slate-400 text-xs mono">{money(p.price)} c/u</p>
                    </div>
                    <div className="flex items-center bg-slate-100 rounded-lg">
                      <button onClick={() => decItem(p.id)} className="w-8 h-8 flex items-center justify-center text-slate-500 hover:text-[#FF4F00] hover:bg-white rounded-l-lg transition-all"><Icons.minus size={14} /></button>
                      <span className="w-8 text-center mono text-sm font-bold text-slate-800">{p.qty}</span>
                      <button onClick={() => addItem(p)} className="w-8 h-8 flex items-center justify-center text-slate-500 hover:text-[#FF4F00] hover:bg-white rounded-r-lg transition-all"><Icons.plus size={14} /></button>
                    </div>
                    <div className="text-right">
                      <p className="mono text-sm font-bold text-slate-700">{money(p.price * p.qty)}</p>
                    </div>
                    <button onClick={() => removeItem(p.id)} className="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 transition-all"><Icons.x size={14} /></button>
                  </div>
                ))
              )}
            </div>

            {/* Checkout */}
            <div className="bg-gradient-to-b from-slate-50 to-white p-5 border-t border-slate-200">
              <div className="space-y-2 mb-5">
                <div className="flex justify-between text-slate-500 text-sm"><span>Subtotal</span><span className="mono">{money(subtotal)}</span></div>
                <div className="flex justify-between text-slate-500 text-sm"><span>IGV (18%)</span><span className="mono">{money(igv)}</span></div>
                <div className="flex justify-between text-slate-800 font-bold text-lg pt-3 border-t-2 border-slate-200 border-dashed mt-3">
                  <span>Total</span>
                  <span className="mono text-[#FF4F00] text-2xl">{money(total)}</span>
                </div>
              </div>

              <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Método de Pago</p>
              <div className="grid grid-cols-3 gap-2 mb-4">
                {[{ id: "Efectivo", icon: Icons.banknote, label: "Efectivo" }, { id: "Plin", icon: Icons.qr, label: "Plin" }, { id: "Yape", icon: Icons.zap, label: "Yape" }].map(m => (
                  <button key={m.id} onClick={() => { setMethod(m.id); setCashInput(""); setQrConfirmed(false); }}
                    className={`py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 border transition-all ${method === m.id ? "bg-slate-900 text-white border-slate-900 shadow-md" : "bg-white text-slate-600 border-slate-200 hover:border-slate-300"}`}>
                    <m.icon size={14} /> {m.label}
                  </button>
                ))}
              </div>

              <div className="min-h-[90px]">
                {method === "Efectivo" && (
                  <div className="animate-fade-up bg-white p-3 rounded-xl border border-slate-200">
                    <div className="relative">
                      <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 mono text-sm">S/</span>
                      <input type="number" value={cashInput} onChange={e => setCashInput(e.target.value)} placeholder="0.00"
                        className="w-full bg-slate-50 border-none rounded-lg pl-9 pr-3 py-2.5 mono text-lg font-semibold focus:outline-none focus:ring-2 focus:ring-[#FF4F00]/20 transition-all" />
                    </div>
                    {cashInput !== "" && (
                      <div className={`mt-2 p-2 rounded-lg text-sm font-medium flex justify-between items-center ${vuelto >= 0 ? "bg-emerald-50 text-emerald-700" : "bg-red-50 text-red-600"}`}>
                        <span>{vuelto >= 0 ? "Vuelto" : "Faltante"}</span>
                        <span className="mono text-lg font-bold">{money(Math.abs(vuelto))}</span>
                      </div>
                    )}
                  </div>
                )}
                {(method === "Plin" || method === "Yape") && (
                  <div className="animate-fade-up flex flex-col items-center bg-white p-4 rounded-xl border border-slate-200">
                    <QRPattern size={130} />
                    {!qrConfirmed ? (
                      <button onClick={() => setQrConfirmed(true)} className="mt-3 px-4 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-medium rounded-full transition-colors">
                        Simular Pago ({method})
                      </button>
                    ) : (
                      <div className="mt-3 flex items-center gap-2 text-emerald-600 bg-emerald-50 px-4 py-1.5 rounded-full text-sm font-semibold animate-bounce-in">
                        <Icons.check size={16} /> Pago confirmado
                      </div>
                    )}
                  </div>
                )}
              </div>

              <button onClick={cobrar} disabled={!readyToCharge}
                className={`w-full mt-4 py-4 rounded-2xl text-base font-bold tracking-wide transition-all duration-300 shadow-lg flex items-center justify-center gap-2 ripple-effect ${readyToCharge ? "bg-gradient-to-r from-[#FF4F00] to-[#E63900] text-white shadow-[#FF4F00]/25 hover:shadow-[#FF4F00]/40 hover:-translate-y-0.5 active:translate-y-0" : "bg-slate-200 text-slate-400 cursor-not-allowed shadow-none"}`}>
                {readyToCharge ? <><Icons.check size={18} /> Cobrar {money(total)}</> : "Agrega productos para cobrar"}
              </button>
            </div>
          </div>

          {/* Receipt Modal */}
          {showReceipt && <ReceiptModal ticket={showReceipt} onClose={() => setShowReceipt(null)} />}
        </div>
      );
    }

    // ─── DELIVERY PAGE ────────────────────────────────────────────────

        { id: 3, client: "Ana Torres", address: "Calle Los Olivos 789", items: "3x Ají de Gallina, 1x Inca Kola", total: 84, status: "preparando", time: "13:45" },
        { id: 4, client: "Pedro Sánchez", address: "Av. La Marina 321", items: "1x Causa Limeña, 1x Tallarín Saltado", total: 43, status: "pendiente", time: "14:00" },
      ]);
      const statusConfig = {
        pendiente: { bg: "bg-amber-50", text: "text-amber-700", border: "border-amber-200", dot: "bg-amber-500" },
        preparando: { bg: "bg-blue-50", text: "text-blue-700", border: "border-blue-200", dot: "bg-blue-500" },
        enviado: { bg: "bg-violet-50", text: "text-violet-700", border: "border-violet-200", dot: "bg-violet-500" },
        entregado: { bg: "bg-emerald-50", text: "text-emerald-700", border: "border-emerald-200", dot: "bg-emerald-500" },
      };
      return (
        <div className="p-6 space-y-6 animate-fade-in">
          <div>
            <h1 className="text-2xl font-bold text-slate-800">Delivery</h1>
            <p className="text-slate-500 text-sm mt-1">{orders.filter(o => o.status !== "entregado").length} pedidos activos</p>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {orders.map((order, i) => {
              const sc = statusConfig[order.status];
              return (
                <div key={order.id} className="animate-fade-up bg-white rounded-2xl p-5 border border-slate-100 hover:shadow-lg transition-all" style={{ animationDelay: `${i * 0.1}s` }}>
                  <div className="flex items-start justify-between mb-3">
                    <div>
                      <h3 className="font-bold text-slate-800">{order.client}</h3>
                      <p className="text-xs text-slate-400 mt-0.5">{order.address}</p>
                    </div>
                    <span className={`px-3 py-1 rounded-full text-xs font-bold capitalize ${sc.bg} ${sc.text} ${sc.border} border flex items-center gap-1.5`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${sc.dot}`}></span>
                      {order.status}
                    </span>
                  </div>
                  <p className="text-sm text-slate-600 mb-3">{order.items}</p>
                  <div className="flex items-center justify-between pt-3 border-t border-slate-100">
                    <span className="text-xs text-slate-400 flex items-center gap-1"><Icons.clock size={12} /> {order.time}</span>
                    <span className="mono font-bold text-[#FF4F00]">{money(order.total)}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─── HISTORY PAGE ─────────────────────────────────────────────────
    function HistoryPage({ ventas }) {
      const [filter, setFilter] = useState("all");
      const filtered = useMemo(() => {
        if (filter === "all") return ventas;
        return ventas.filter(v => v.method === filter);
      }, [ventas, filter]);
      return (
        <div className="p-6 space-y-6 animate-fade-in">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-2xl font-bold text-slate-800">Historial de Ventas</h1>
              <p className="text-slate-500 text-sm mt-1">{ventas.length} transacciones registradas</p>
            </div>
            <div className="flex gap-2">
              {[{ id: "all", label: "Todas" }, { id: "Efectivo", label: "Efectivo" }, { id: "Plin", label: "Plin" }, { id: "Yape", label: "Yape" }].map(f => (
                <button key={f.id} onClick={() => setFilter(f.id)}
                  className={`px-4 py-2 rounded-xl text-xs font-semibold transition-all ${filter === f.id ? "bg-slate-900 text-white" : "bg-white text-slate-600 border border-slate-200 hover:border-slate-300"}`}>
                  {f.label}
                </button>
              ))}
            </div>
          </div>
          {filtered.length === 0 ? (
            <div className="bg-white rounded-2xl p-12 text-center text-slate-400">
              <Icons.receipt size={48} className="mx-auto mb-4 opacity-30" />
              <p className="font-medium">No hay ventas registradas</p>
            </div>
          ) : (
            <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
              <table className="w-full">
                <thead>
                  <tr className="bg-slate-50 text-left text-xs text-slate-400 uppercase tracking-wider">
                    <th className="px-5 py-3 font-medium">ID</th>
                    <th className="px-5 py-3 font-medium">Hora</th>
                    <th className="px-5 py-3 font-medium">Tipo</th>
                    <th className="px-5 py-3 font-medium">Items</th>
                    <th className="px-5 py-3 font-medium">Método</th>
                    <th className="px-5 py-3 font-medium text-right">Total</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-50">
                  {filtered.map(v => (
                    <tr key={v.id} className="hover:bg-slate-50/50 transition-colors">
                      <td className="px-5 py-3 text-sm mono text-slate-500">#{String(v.id).slice(-6)}</td>
                      <td className="px-5 py-3 text-sm mono text-slate-600">{v.time}</td>
                      <td className="px-5 py-3"><span className="text-xs font-medium bg-slate-100 text-slate-600 px-2 py-1 rounded-full">{v.type}</span></td>
                      <td className="px-5 py-3 text-sm text-slate-600">{v.items.reduce((s, i) => s + i.qty, 0)} items</td>
                      <td className="px-5 py-3"><span className={`text-xs font-bold px-2 py-1 rounded-full ${v.method === "Efectivo" ? "bg-emerald-50 text-emerald-600" : v.method === "Plin" ? "bg-blue-50 text-blue-600" : "bg-violet-50 text-violet-600"}`}>{v.method}</span></td>
                      <td className="px-5 py-3 text-sm font-bold text-slate-800 text-right mono">{money(v.total)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ─── SETTINGS PAGE ────────────────────────────────────────────────
    function SettingsPage() {
      return (
        <div className="p-6 space-y-6 animate-fade-in max-w-3xl">
          <div>
            <h1 className="text-2xl font-bold text-slate-800">Configuración</h1>
            <p className="text-slate-500 text-sm mt-1">Personaliza tu sistema POS</p>
          </div>
          <div className="bg-white rounded-2xl border border-slate-100 p-6 space-y-6">
            <div>
              <h3 className="font-bold text-slate-800 mb-4">Información del Restaurante</h3>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1.5 block">Nombre</label>
                  <input defaultValue="Sazón Peru" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#FF4F00]/20 focus:border-[#FF4F00]" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1.5 block">RUC</label>
                  <input defaultValue="20512345678" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm mono focus:outline-none focus:ring-2 focus:ring-[#FF4F00]/20 focus:border-[#FF4F00]" />
                </div>
                <div className="col-span-2">
                  <label className="text-xs font-medium text-slate-500 mb-1.5 block">Dirección</label>
                  <input defaultValue="Av. Javier Prado Este 4200, Santiago de Surco, Lima" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#FF4F00]/20 focus:border-[#FF4F00]" />
                </div>
              </div>
            </div>
            <div className="border-t border-slate-100 pt-6">
              <h3 className="font-bold text-slate-800 mb-4">Impresora</h3>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1.5 block">Tipo</label>
                  <select className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#FF4F00]/20 focus:border-[#FF4F00]">
                    <option>Thermal 80mm</option>
                    <option>Thermal 58mm</option>
                    <option>Matrix</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1.5 block">Puerto</label>
                  <input defaultValue="COM3" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm mono focus:outline-none focus:ring-2 focus:ring-[#FF4F00]/20 focus:border-[#FF4F00]" />
                </div>
              </div>
            </div>
            <div className="border-t border-slate-100 pt-6">
              <h3 className="font-bold text-slate-800 mb-4">IGV</h3>
              <div className="flex items-center gap-4">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" defaultChecked className="w-4 h-4 rounded border-slate-300 text-[#FF4F00] focus:ring-[#FF4F00]" />
                  <span className="text-sm text-slate-600">Incluir IGV (18%) automáticamente</span>
                </label>
              </div>
            </div>
            <div className="border-t border-slate-100 pt-6 flex justify-end">
              <button className="px-6 py-2.5 bg-[#FF4F00] text-white rounded-xl font-medium text-sm hover:bg-[#E63900] transition-colors">Guardar Cambios</button>
            </div>
          </div>
        </div>
      );
    }

    // ─── MAIN APP ─────────────────────────────────────────────────────
    export default function App() {
      const [page, setPage] = useState("pos");
      const [ventas, setVentas] = useState([]);
      const [toast, setToast] = useState(null);
      const [isLoaded, setIsLoaded] = useState(false);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

      useEffect(() => { setIsLoaded(true); }, []);

      const showToast = useCallback((message, type = "success") => {
        setToast({ message, type, id: Date.now() });
      }, []);

      const handleSale = useCallback((ticket) => {
        setVentas(prev => [ticket, ...prev]);
        showToast(`Venta registrada: ${money(ticket.total)}`);
      }, [showToast]);

      const totalCaja = ventas.reduce((s, v) => s + v.total, 0);

      const navItems = [
        { id: "dashboard", icon: Icons.home, label: "Dashboard" },
        { id: "pos", icon: Icons.grid, label: "Punto de Venta" },
        { id: "tables", icon: Icons.store, label: "Mesas" },
        { id: "delivery", icon: Icons.truck, label: "Delivery" },
        { id: "history", icon: Icons.receipt, label: "Historial" },
        { id: "settings", icon: Icons.settings, label: "Configuración" },
      ];

      return (
        <div className={`h-screen flex overflow-hidden transition-opacity duration-700 ${isLoaded ? "opacity-100" : "opacity-0"}`}>
          {/* Sidebar */}
          <aside className={`${sidebarCollapsed ? "w-[72px]" : "w-60"} bg-[#0F172A] text-slate-300 flex flex-col justify-between py-5 transition-all duration-300 z-20 flex-shrink-0`}>
            <div>
              <div className={`flex items-center ${sidebarCollapsed ? "justify-center" : "justify-start px-5"} mb-8`}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#FF4F00] to-[#E63900] flex items-center justify-center shadow-lg shadow-[#FF4F00]/20 flex-shrink-0">
                  <Icons.utensils size={20} />
                </div>
                {!sidebarCollapsed && (
                  <div className="ml-3">
                    <span className="font-bold text-lg text-white tracking-tight">Sazón</span>
                    <span className="font-bold text-lg text-[#FF4F00]">POS</span>
                  </div>
                )}
              </div>
              <nav className="space-y-1 px-3">
                {navItems.map(item => (
                  <button key={item.id} onClick={() => setPage(item.id)}
                    className={`w-full flex items-center ${sidebarCollapsed ? "justify-center" : "justify-start"} px-3 py-2.5 rounded-xl transition-all text-sm ${page === item.id ? "bg-[#FF4F00]/10 text-[#FF4F00] font-semibold" : "text-slate-400 hover:bg-white/5 hover:text-white"}`}>
                    <item.icon size={20} />
                    {!sidebarCollapsed && <span className="ml-3">{item.label}</span>}
                  </button>
                ))}
              </nav>
            </div>
            <div className="px-3">
              <button onClick={() => setSidebarCollapsed(!sidebarCollapsed)} className="w-full flex items-center justify-center px-3 py-2.5 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition-all mb-3">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ transform: sidebarCollapsed ? "rotate(180deg)" : "none", transition: "transform 0.3s" }}>
                  <polyline points="15 18 9 12 15 6" />
                </svg>
              </button>
              <div className="bg-white/5 rounded-xl p-3 flex items-center cursor-pointer hover:bg-white/10 transition-colors">
                <div className="w-8 h-8 rounded-full bg-gradient-to-br from-[#FF4F00] to-[#E63900] flex items-center justify-center text-white text-xs font-bold flex-shrink-0">AD</div>
                {!sidebarCollapsed && (
                  <div className="ml-3">
                    <p className="text-sm text-white font-medium">Admin Demo</p>
                    <p className="text-xs text-slate-500">Caja Principal</p>
                  </div>
                )}
              </div>
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 flex flex-col h-full bg-[#F1F5F9] overflow-hidden">
            {/* Topbar */}
            <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between z-10 flex-shrink-0">
              <div className="flex items-center gap-4">
                <h2 className="font-bold text-slate-800 text-lg">
                  {navItems.find(n => n.id === page)?.label}
                </h2>
              </div>
              <div className="flex items-center gap-5">
                <div className="text-right hidden sm:block">
                  <p className="text-[10px] text-slate-400 font-semibold uppercase tracking-widest">Caja Actual</p>
                  <p className="mono text-lg font-bold text-emerald-600">{money(totalCaja)}</p>
                </div>
                <div className="w-px h-8 bg-slate-200 hidden sm:block"></div>
                <button className="relative p-2 text-slate-400 hover:text-slate-600 transition-colors bg-slate-100 rounded-full hover:bg-slate-200">
                  <Icons.bell size={18} />
                  {ventas.length > 0 && <span className="absolute -top-0.5 -right-0.5 w-4 h-4 bg-[#FF4F00] text-white text-[9px] font-bold rounded-full flex items-center justify-center">{Math.min(ventas.length, 9)}</span>}
                </button>
              </div>
            </header>

            {/* Page Content */}
            <div className="flex-1 overflow-hidden flex">
              {page === "dashboard" && <div className="flex-1 overflow-y-auto"><Dashboard ventas={ventas} /></div>}
              {page === "pos" && <POSPage onSale={handleSale} />}
              {page === "tables" && <div className="flex-1 overflow-y-auto"><TablesPage /></div>}
              {page === "delivery" && <div className="flex-1 overflow-y-auto"><DeliveryPage /></div>}
              {page === "history" && <div className="flex-1 overflow-y-auto"><HistoryPage ventas={ventas} /></div>}
              {page === "settings" && <div className="flex-1 overflow-y-auto"><SettingsPage /></div>}
            </div>
          </main>

          {/* Toast Notifications */}
          <div className="fixed top-5 right-5 z-50 space-y-3">
            {toast && <Toast key={toast.id} message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
